<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HedgeFund V2 — Alpha Discovery Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #050507;
  --s1:        #0b0b0f;
  --s2:        #111117;
  --s3:        #18181f;
  --border:    rgba(255,255,255,0.07);
  --border-hi: rgba(255,255,255,0.14);
  --text-1:    #ededf0;
  --text-2:    #8a8a9a;
  --text-3:    #48485a;
  --accent:    #6366f1;
  --accent-2:  #818cf8;
  --accent-bg: rgba(99,102,241,0.12);
  --green:     #22c55e;
  --green-bg:  rgba(34,197,94,0.1);
  --amber:     #f59e0b;
  --amber-bg:  rgba(245,158,11,0.1);
  --red:       #ef4444;
  --red-bg:    rgba(239,68,68,0.1);
  --blue:      #3b82f6;
  --blue-bg:   rgba(59,130,246,0.1);
  --mono: 'Fira Code', ui-monospace, monospace;
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(0.16,1,0.3,1);
  --r:   8px;
  --r-lg:12px;
}
*  { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body {
  background: var(--bg);
  color: var(--text-1);
  font-family: var(--sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.09); border-radius:2px; }
::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,0.16); }

/* ── Layout ─────────────────────────────────────────────────────────── */
#root { height:100dvh; display:grid; grid-template-rows:44px 1fr; }

header {
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid var(--border);
  background:rgba(5,5,7,0.9);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  z-index:10; position:relative;
}
.header-brand {
  font-family:var(--mono); font-size:10px; font-weight:600;
  letter-spacing:.22em; color:var(--text-3); text-transform:uppercase;
  user-select:none;
}
.header-brand em { font-style:normal; color:var(--accent-2); }
.header-right { display:flex; align-items:center; gap:16px; }

/* Analyze button */
.btn-analyze {
  font-family:var(--mono); font-size:10px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-2); background:var(--s2);
  border:1px solid var(--border); border-radius:6px;
  padding:5px 14px; cursor:pointer;
  display:flex; align-items:center; gap:7px;
  transition:border-color 180ms var(--ease), color 180ms, background 180ms;
}
.btn-analyze:hover { border-color:var(--border-hi); color:var(--text-1); background:var(--s3); }
.btn-analyze:active { transform:scale(0.97); }

/* SSE status */
.sse-wrap { display:flex; align-items:center; gap:8px; }
.sse-dot-outer { position:relative; width:8px; height:8px; }
.sse-ping {
  position:absolute; inset:0; border-radius:50%;
  background:var(--green); opacity:.55;
  animation:ping 1.8s ease-out infinite;
}
.sse-core { position:relative; width:8px; height:8px; border-radius:50%; background:var(--green); }
.sse-label { font-family:var(--mono); font-size:10px; color:var(--green); letter-spacing:.1em; }

/* Panels */
.panels { display:grid; grid-template-columns:minmax(0,1fr) 300px 360px; overflow:hidden; height:100%; }
.p-right { border-right:1px solid var(--border); }

/* Panel header */
.ph {
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; height:40px; border-bottom:1px solid var(--border); flex-shrink:0;
}
.ph-title { font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.2em; color:var(--text-3); text-transform:uppercase; }
.ph-badge {
  font-family:var(--mono); font-size:10px; color:var(--text-3);
  background:var(--s2); border:1px solid var(--border); border-radius:4px; padding:2px 8px;
}
.ph-live { display:flex; align-items:center; gap:8px; }
.live-dot-wrap { position:relative; width:7px; height:7px; }
.live-ping { position:absolute; inset:0; border-radius:50%; background:var(--green); opacity:.5; animation:ping 1.8s ease-out infinite; }
.live-core { position:relative; width:7px; height:7px; border-radius:50%; background:var(--green); }

/* Scrollable panel body */
.ps { overflow-y:auto; height:calc(100% - 40px); }

/* Section labels */
.slabel {
  font-family:var(--mono); font-size:9px; font-weight:600;
  letter-spacing:.2em; text-transform:uppercase; color:var(--text-3);
  padding:11px 14px 5px;
}
.slabel-red { color:rgba(239,68,68,0.6); }
.sep { height:1px; background:var(--border); margin:6px 0; }

/* ── Feed cards ─────────────────────────────────────────────────────── */
.fi-btn { width:100%; text-align:left; background:none; border:none; cursor:pointer; padding:0 10px 4px; }
.fc {
  display:flex; align-items:stretch; overflow:hidden;
  border-radius:var(--r); border:1px solid var(--border);
  background:rgba(255,255,255,0.015);
  transition:border-color 180ms var(--ease), background 180ms;
}
.fi-btn:hover .fc { border-color:var(--border-hi); background:rgba(255,255,255,0.03); }
.fc-bar { width:3px; flex-shrink:0; border-radius:4px 0 0 4px; }
.fc-body { flex:1; padding:8px 12px; display:flex; flex-direction:column; gap:3px; }
.fc-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.fc-ticker { font-family:var(--mono); font-size:13px; font-weight:700; color:var(--text-1); }
.fc-meta { display:flex; align-items:center; gap:7px; }
.fc-conv {
  font-family:var(--mono); font-size:10px; font-weight:700;
  background:var(--accent-bg); color:var(--accent-2);
  border:1px solid rgba(99,102,241,0.2); border-radius:3px; padding:1px 6px;
}
.fc-time { font-family:var(--mono); font-size:10px; color:var(--text-3); }
.fc-headline { font-size:11px; color:var(--text-2); line-height:1.45; }
.fc-rejection { font-size:11px; color:rgba(239,68,68,0.75); line-height:1.45; }

/* ── Opportunity cards ──────────────────────────────────────────────── */
.opp-card {
  border:1px solid var(--border); border-radius:var(--r-lg);
  background:rgba(255,255,255,0.018); overflow:hidden;
  transition:border-color 200ms var(--ease);
}
.opp-card:hover { border-color:var(--border-hi); }
.opp-accent { height:2px; }
.opp-inner { padding:15px 16px; display:flex; flex-direction:column; gap:11px; }
.opp-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.opp-ticker { font-family:var(--mono); font-size:19px; font-weight:700; color:var(--text-1); }
.opp-conv-row { display:flex; align-items:baseline; gap:6px; }
.opp-conv-num { font-family:var(--mono); font-size:38px; font-weight:700; line-height:1; }
.opp-conv-lbl { font-size:12px; color:var(--text-3); }

/* Metric cells */
.metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.metric {
  background:var(--s2); border:1px solid var(--border);
  border-radius:6px; padding:8px 10px;
}
.metric-k { font-family:var(--mono); font-size:9px; color:var(--text-3); letter-spacing:.1em; text-transform:uppercase; margin-bottom:4px; }
.metric-v { font-family:var(--mono); font-size:13px; font-weight:600; color:var(--text-1); }

/* Catalysts */
.cat-list { display:flex; flex-direction:column; gap:5px; }
.cat-item { display:flex; gap:7px; font-size:11.5px; color:var(--text-2); line-height:1.45; }
.cat-dot { color:var(--accent-2); flex-shrink:0; margin-top:1px; font-size:10px; }

/* Agent section header */
.agent-section-lbl {
  font-family:var(--mono); font-size:9px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--text-3);
  margin-bottom:7px;
}
.agent-rows { display:flex; flex-direction:column; gap:0; }
.agent-row { display:flex; align-items:center; gap:8px; padding:3px 0; }
.agent-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.agent-name { font-family:var(--mono); font-size:10.5px; color:var(--text-2); width:105px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.agent-bar-bg { flex:1; height:3px; border-radius:2px; background:var(--s3); overflow:hidden; }
.agent-bar-fill { height:100%; border-radius:2px; }
.agent-score { font-family:var(--mono); font-size:10px; color:var(--text-3); width:22px; text-align:right; flex-shrink:0; }
.agent-verdict { font-family:var(--mono); font-size:10px; font-weight:700; width:38px; text-align:right; flex-shrink:0; }

/* CIO summary box */
.cio-box {
  background:var(--accent-bg); border:1px solid rgba(99,102,241,0.18);
  border-radius:var(--r); padding:10px 12px;
}
.cio-lbl { font-family:var(--mono); font-size:10px; font-weight:700; color:var(--accent-2); margin-right:7px; }
.cio-text { font-size:11.5px; color:var(--text-2); line-height:1.55; }

/* Badge */
.badge {
  display:inline-flex; align-items:center;
  padding:2px 8px; border-radius:4px;
  font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.04em;
}

/* ── Graph ──────────────────────────────────────────────────────────── */
.graph-wrap { width:100%; height:100%; position:relative; overflow:hidden; }
.graph-bg {
  position:absolute; inset:0;
  background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size:28px 28px;
}

/* ── Sheet ──────────────────────────────────────────────────────────── */
.sheet-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.72);
  backdrop-filter:blur(4px); z-index:40; display:none;
}
.sheet-overlay.open { display:block; }
.sheet-panel {
  position:fixed; top:0; right:0; bottom:0;
  width:min(520px,100vw);
  background:var(--s1); border-left:1px solid var(--border);
  z-index:50; display:none; flex-direction:column;
  transform:translateX(32px); opacity:0;
  transition:transform 280ms var(--ease), opacity 250ms ease;
}
.sheet-panel.open { display:flex; transform:translateX(0); opacity:1; }
.sheet-header {
  flex-shrink:0; border-bottom:1px solid var(--border);
  padding:20px 24px 16px;
}
.sheet-h-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
.sheet-ticker-wrap { display:flex; align-items:center; gap:12px; }
.sheet-ticker { font-family:var(--mono); font-size:26px; font-weight:700; color:var(--text-1); }
.sheet-sub { font-size:12px; color:var(--text-3); }
.sheet-close {
  background:var(--s2); border:1px solid var(--border);
  color:var(--text-3); cursor:pointer; width:28px; height:28px;
  border-radius:6px; display:flex; align-items:center; justify-content:center;
  font-size:14px; transition:border-color 150ms, color 150ms;
}
.sheet-close:hover { border-color:var(--border-hi); color:var(--text-1); }
.sheet-body { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:24px; }
.sheet-section-lbl {
  font-family:var(--mono); font-size:9px; font-weight:600;
  letter-spacing:.2em; text-transform:uppercase; color:var(--text-3);
  margin-bottom:12px;
}
.sheet-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
.sheet-stat {
  background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r); padding:12px 14px; text-align:center;
}
.sheet-stat-v { font-family:var(--mono); font-size:22px; font-weight:700; color:var(--text-1); }
.sheet-stat-k { font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); margin-top:3px; }
.sheet-divider { height:1px; background:var(--border); }
.sheet-agent-card {
  background:var(--s2); border:1px solid var(--border);
  border-radius:var(--r); padding:12px 14px;
}
.sheet-agent-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.sheet-agent-name-wrap { display:flex; align-items:center; gap:8px; }
.sheet-agent-name { font-family:var(--mono); font-size:12px; font-weight:600; color:var(--text-1); }
.sheet-conf-row { display:flex; align-items:center; gap:8px; }
.sheet-conf-bar { flex:1; height:3px; border-radius:2px; background:var(--s3); }
.sheet-conf-fill { height:100%; border-radius:2px; }
.sheet-conf-val { font-family:var(--mono); font-size:11px; font-weight:600; color:var(--text-3); }
.sheet-rationale { font-size:12px; color:var(--text-2); line-height:1.55; margin-top:8px; font-style:italic; }
.kill-box { background:var(--red-bg); border:1px solid rgba(239,68,68,0.2); border-radius:var(--r); padding:12px 14px; }
.kill-item { display:flex; gap:8px; font-size:12px; color:rgba(239,68,68,0.8); line-height:1.45; }
.kill-icon { flex-shrink:0; margin-top:1px; font-size:11px; }

/* ── Analyze modal ──────────────────────────────────────────────────── */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.82);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  z-index:60; display:none; align-items:center; justify-content:center;
}
.modal-overlay.open { display:flex; }
.modal-box {
  width:480px; max-width:calc(100vw - 32px);
  background:rgba(11,11,16,0.98);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px; overflow:hidden;
  box-shadow:0 40px 120px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.04);
  transform:scale(0.95) translateY(12px); opacity:0;
  transition:transform 260ms var(--ease), opacity 220ms ease;
}
.modal-overlay.open .modal-box { transform:scale(1) translateY(0); opacity:1; }
.modal-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 24px 16px; border-bottom:1px solid var(--border);
}
.modal-eyebrow { font-family:var(--mono); font-size:9px; font-weight:600; letter-spacing:.2em; color:var(--text-3); text-transform:uppercase; margin-bottom:4px; }
.modal-title { font-size:16px; font-weight:600; color:var(--text-1); }
.modal-close {
  background:var(--s2); border:1px solid var(--border);
  color:var(--text-3); cursor:pointer; width:28px; height:28px;
  border-radius:6px; display:flex; align-items:center; justify-content:center;
  font-size:14px; transition:border-color 150ms, color 150ms; flex-shrink:0;
}
.modal-close:hover { border-color:var(--border-hi); color:var(--text-1); }
.modal-body { padding:24px; }
.modal-desc { font-size:12px; color:var(--text-2); margin-bottom:16px; line-height:1.55; }
.input-wrap { position:relative; margin-bottom:10px; }
.input-prefix {
  position:absolute; left:15px; top:50%; transform:translateY(-50%);
  font-family:var(--mono); font-size:18px; font-weight:600; color:var(--text-3);
  pointer-events:none;
}
.ticker-input {
  width:100%; background:var(--s2); border:1px solid var(--border); border-radius:10px;
  padding:14px 16px 14px 36px;
  font-family:var(--mono); font-size:22px; font-weight:700; color:var(--text-1);
  letter-spacing:.08em; outline:none; text-transform:uppercase;
  transition:border-color 180ms var(--ease), box-shadow 180ms;
}
.ticker-input:focus { border-color:rgba(99,102,241,0.45); box-shadow:0 0 0 3px rgba(99,102,241,0.1); }
.ticker-input::placeholder { color:var(--text-3); font-weight:400; font-size:16px; letter-spacing:.02em; }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px; }
.chip {
  background:var(--s2); border:1px solid var(--border);
  color:var(--text-3); font-family:var(--mono); font-size:10px; font-weight:500;
  padding:4px 10px; border-radius:4px; cursor:pointer;
  transition:all 160ms var(--ease);
}
.chip:hover { border-color:var(--border-hi); color:var(--text-1); background:var(--s3); }
.btn-primary {
  width:100%; background:var(--accent); border:none; border-radius:10px;
  color:#fff; font-family:var(--mono); font-size:11px; font-weight:700;
  letter-spacing:.12em; padding:13px; cursor:pointer;
  transition:background 200ms var(--ease), transform 150ms, box-shadow 200ms;
}
.btn-primary:hover { background:#5558e8; box-shadow:0 0 28px rgba(99,102,241,0.35); }
.btn-primary:active { transform:scale(0.98); }

/* Loading state */
#az-loading { display:none; padding:24px; }
.az-status-row { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.az-status-ping { position:relative; width:8px; height:8px; flex-shrink:0; }
.az-status-ping-anim { position:absolute; inset:0; border-radius:50%; background:var(--green); opacity:.5; animation:ping 1s ease-out infinite; }
.az-status-dot { position:relative; width:8px; height:8px; border-radius:50%; background:var(--green); }
.az-status-label { font-family:var(--mono); font-size:11px; color:var(--green); letter-spacing:.1em; }
.az-agent-rows { background:var(--s2); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; }
.progress-track { height:2px; background:var(--s3); border-radius:1px; overflow:hidden; margin-top:16px; }
.progress-fill { height:100%; background:linear-gradient(90deg, var(--accent), var(--green)); border-radius:1px; transition:width .4s var(--ease); }

/* Error state */
#az-error { display:none; padding:24px; }
.error-box { background:var(--red-bg); border:1px solid rgba(239,68,68,0.2); border-radius:var(--r); padding:14px 16px; margin-bottom:16px; }
.btn-secondary {
  width:100%; background:var(--s2); border:1px solid var(--border);
  color:var(--text-2); font-family:var(--mono); font-size:11px; font-weight:600;
  letter-spacing:.08em; padding:11px; border-radius:10px; cursor:pointer;
  transition:border-color 180ms, color 180ms;
}
.btn-secondary:hover { border-color:var(--border-hi); color:var(--text-1); }

/* Market data block */
.az-mkt-block {
  background:var(--s2); border:1px solid var(--border-hi);
  border-radius:var(--r); padding:12px 14px; margin-bottom:16px;
}
.az-mkt-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.az-mkt-lbl { font-family:var(--mono); font-size:9px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--text-3); }
.az-live-badge { font-family:var(--mono); font-size:9px; color:var(--green); background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.2); border-radius:3px; padding:2px 7px; }
.az-mkt-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.az-mkt-cell { display:flex; flex-direction:column; gap:3px; }
.az-mkt-k { font-family:var(--mono); font-size:9px; color:var(--text-3); letter-spacing:.08em; text-transform:uppercase; }
.az-mkt-v { font-family:var(--mono); font-size:13px; font-weight:600; color:var(--text-1); }
.az-52w { margin-top:10px; padding-top:10px; border-top:1px solid var(--border); display:flex; align-items:center; gap:12px; }
.az-52w-lbl { font-family:var(--mono); font-size:9px; color:var(--text-3); letter-spacing:.1em; flex-shrink:0; }
.az-52w-track { flex:1; height:4px; border-radius:2px; background:var(--s3); position:relative; overflow:visible; }
.az-52w-fill { height:100%; border-radius:2px; background:linear-gradient(90deg,var(--accent),var(--green)); }
.az-52w-marker { position:absolute; top:50%; transform:translate(-50%,-50%); width:8px; height:8px; border-radius:50%; background:var(--text-1); border:2px solid var(--bg); }
.az-52w-vals { font-family:var(--mono); font-size:9px; color:var(--text-3); flex-shrink:0; }

/* Result state */
#az-result { display:none; }
.az-result-scroll { max-height:68vh; overflow-y:auto; padding:20px 24px 0; }
.az-result-hero {
  display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  padding-bottom:16px; border-bottom:1px solid var(--border); margin-bottom:16px;
}
.az-result-ticker { font-family:var(--mono); font-size:26px; font-weight:700; color:var(--text-1); line-height:1; margin-bottom:6px; }
.az-result-name   { font-size:11px; color:var(--text-3); margin-bottom:10px; }
.az-conv-big      { font-family:var(--mono); font-size:52px; font-weight:700; line-height:1; }
.az-conv-lbl      { font-size:10px; color:var(--text-3); margin-top:4px; letter-spacing:.1em; text-transform:uppercase; }
.az-cio-box {
  background:var(--accent-bg); border:1px solid rgba(99,102,241,0.18);
  border-radius:var(--r); padding:12px 14px; margin-bottom:16px;
}
.az-cio-lbl { font-family:var(--mono); font-size:9px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--accent-2); margin-bottom:5px; }
.az-cio-text { font-size:12px; color:var(--text-2); line-height:1.6; }
.az-section-lbl {
  font-family:var(--mono); font-size:9px; font-weight:600; letter-spacing:.18em;
  text-transform:uppercase; color:var(--text-3); margin-bottom:8px;
}
.az-agent-card {
  background:var(--s2); border:1px solid var(--border); border-radius:var(--r);
  padding:12px 14px; margin-bottom:6px;
  animation:fadeUp .22s var(--ease) both;
}
.az-agent-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.az-agent-name { font-family:var(--mono); font-size:11px; font-weight:600; color:var(--text-1); flex:1; }
.az-conf-row { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
.az-conf-bar { flex:1; height:3px; border-radius:2px; background:var(--s3); overflow:hidden; }
.az-conf-fill { height:100%; border-radius:2px; }
.az-conf-val { font-family:var(--mono); font-size:10px; color:var(--text-3); width:20px; text-align:right; flex-shrink:0; }
.az-rationale { font-size:11.5px; color:var(--text-2); line-height:1.6; font-style:italic; padding-left:12px; border-left:2px solid rgba(255,255,255,0.08); }
.az-cats { display:flex; flex-direction:column; gap:5px; margin-bottom:16px; }
.az-cat  { display:flex; gap:8px; font-size:11.5px; color:var(--text-2); line-height:1.45; }
.az-cat-dot { color:var(--accent-2); flex-shrink:0; font-size:10px; margin-top:2px; }
.az-kills { display:flex; flex-direction:column; gap:5px; margin-bottom:20px; }
.az-kill { display:flex; gap:8px; font-size:11.5px; color:rgba(239,68,68,0.75); line-height:1.45; }
.az-kill-icon { flex-shrink:0; font-size:10px; margin-top:2px; }
.az-result-footer { padding:16px 24px; border-top:1px solid var(--border); }

/* Animations */
@keyframes ping    { 0%{ transform:scale(1); opacity:.65; } 100%{ transform:scale(2.2); opacity:0; } }
@keyframes pulse   { 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
@keyframes fadeUp  { from{ opacity:0; transform:translateY(5px); } to{ opacity:1; transform:translateY(0); } }
@keyframes dashAnim { to{ stroke-dashoffset:-24; } }
</style>
</head>
<body>
<div id="root">

<!-- ═══ HEADER ═══════════════════════════════════════════════════════════════ -->
<header>
  <span class="header-brand">HEDGE<em>FUND</em> V2 &mdash; ALPHA DISCOVERY ENGINE</span>
  <div class="header-right">
    <button class="btn-analyze" onclick="openAnalyzeModal()">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1v8M1 5h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      ANALYZE TICKER
    </button>
    <div class="sse-wrap">
      <div class="sse-dot-outer"><span class="sse-ping"></span><span class="sse-core"></span></div>

  </div>
</header>

<!-- ═══ THREE-PANEL GRID ════════════════════════════════════════════════════ -->
<div class="panels">

  <!-- LEFT: Pipeline Graph -->
  <div style="position:relative;height:100%;" class="p-right">
    <div class="graph-wrap">
      <div class="graph-bg"></div>
      <svg id="pipeline-svg" width="100%" height="100%" style="position:absolute;inset:0;"></svg>

    <div class="ph ph-live">

        <div class="live-dot-wrap"><span class="live-ping"></span><span class="live-core"></span></div>
        <span class="ph-title">Opportunity Feed</span>
      </div>

      <div class="slabel">Highest Conviction</div>

  </div>

</div>
</div>

<!-- ═══ ANALYZE MODAL ════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal-box" id="modal-box">

    <div class="modal-header">
      <div>
        <div class="modal-eyebrow">Alpha Discovery Engine</div>
        <div class="modal-title">Analyze Ticker</div>
      </div>
      <button class="modal-close" onclick="closeAnalyzeModal()">✕</button>
    </div>

    <!-- Input -->
    <div id="az-input" class="modal-body">

        <button class="chip" onclick="document.getElementById('az-ticker').value='TSLA';startAnalysis()">TSLA</button>
        <button class="chip" onclick="document.getElementById('az-ticker').value='ASML';startAnalysis()">ASML</button>
        <button class="chip" onclick="document.getElementById('az-ticker').value='NVDA';startAnalysis()">NVDA</button>
        <button class="chip" onclick="document.getElementById('az-ticker').value='SHOP';startAnalysis()">SHOP</button>
        <button class="chip" onclick="document.getElementById('az-ticker').value='AMD';startAnalysis()">AMD</button>
        <button class="chip" onclick="document.getElementById('az-ticker').value='LLY';startAnalysis()">LLY</button>
        <button class="chip" onclick="document.getElementById('az-ticker').value='NVO';startAnalysis()">NVO</button>

    </div>

    <!-- Error -->
    <div id="az-error">
      <div class="error-box"><p style="font-size:13px;color:rgba(239,68,68,0.85);" id="az-error-msg"></p></div>
      <button class="btn-secondary" onclick="resetAnalyzeModal()">← TRY AGAIN</button>
    </div>

    <!-- Result -->
    <div id="az-result">
      <div class="az-result-scroll" id="az-result-scroll"></div>
      <div class="az-result-footer">
        <button class="btn-secondary" onclick="resetAnalyzeModal()">← ANALYZE ANOTHER</button>
      </div>
    </div>

  </div>
</div>

<!-- ═══ SHEET OVERLAY ════════════════════════════════════════════════════════ -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
<div class="sheet-panel" id="sheet-panel">
  <div class="sheet-header">
    <div class="sheet-h-row">
      <div class="sheet-ticker-wrap">
        <span class="sheet-ticker" id="sheet-ticker"></span>
        <span id="sheet-verdict-badge"></span>
      </div>
      <button class="sheet-close" onclick="closeSheet()">✕</button>
    </div>
    <p class="sheet-sub">Opportunity analysis breakdown</p>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════════════════════════════════

const AGENTS = [
  { key:'buffett', name:'Warren Buffett', dot:'#fbbf24' },
  { key:'munger',  name:'Charlie Munger', dot:'#a78bfa' },
  { key:'ackman',  name:'Bill Ackman',    dot:'#22d3ee' },
  { key:'cohen',   name:'Steve Cohen',    dot:'#f472b6' },
  { key:'dalio',   name:'Ray Dalio',      dot:'#38bdf8' },
]

const OPPORTUNITIES = [
  {
    id:'NVDA:1714000000', ticker:'NVDA', finalVerdict:'BUY', riskRating:'MEDIUM',
    convictionScore:87, suggestedAllocationPct:4.5, timeHorizon:'12–18 months', expectedUpside:38,
    keyCatalysts:['Blackwell GPU cycle accelerating enterprise AI capex','Data center revenue run-rate exceeds $90B annualized','Sovereign AI tailwind from non-US government deployments'],
    cioSummary:'Dominant moat in AI compute with pricing power intact. Recommend initiating long position on any 5%+ pullback.',
    agentScores:[
      { persona:'buffett', verdict:'HOLD', confidence:62, rationale:'Exceptional business, but valuation demands perfection.' },
      { persona:'munger',  verdict:'BUY',  confidence:81, rationale:'When you find a business with a wide moat, buy more.' },
      { persona:'ackman',  verdict:'BUY',  confidence:91, rationale:'High-conviction long. AI infrastructure is the next internet.' },
      { persona:'cohen',   verdict:'BUY',  confidence:88, rationale:'Technical breakout confirmed. Momentum strongly positive.' },
      { persona:'dalio',   verdict:'BUY',  confidence:79, rationale:'Macro tailwinds from global AI buildout support the thesis.' },
    ],
    killConditions:['Export controls expand to A100 equivalents in key markets','Hyperscaler capex guidance cuts >20%'],
  },
  {
    id:'META:1714001000', ticker:'META', finalVerdict:'BUY', riskRating:'LOW',
    convictionScore:82, suggestedAllocationPct:3.8, timeHorizon:'6–12 months', expectedUpside:22,
    keyCatalysts:['Llama 4 driving monetization uplift across Reels & Threads','Reality Labs losses narrowing — Quest 3S gaining traction','Ad pricing power recovering in core markets'],
    cioSummary:'Zuckerberg\'s efficiency era delivering. FCF yield ~4.5% at current levels makes this compelling vs peers.',
    agentScores:[
      { persona:'buffett', verdict:'BUY',  confidence:85, rationale:'Network effects remain unassailable. Earnings quality is high.' },
      { persona:'munger',  verdict:'BUY',  confidence:88, rationale:'Management has proven its discipline. This is cheap.' },
      { persona:'ackman',  verdict:'BUY',  confidence:82, rationale:'Operating leverage kicking in. Multiple re-rating likely.' },
      { persona:'cohen',   verdict:'HOLD', confidence:71, rationale:'Approaching near-term resistance. Wait for pullback.' },
      { persona:'dalio',   verdict:'BUY',  confidence:74, rationale:'Digital ad cycle recovering. Macro backdrop supportive.' },
    ],
    killConditions:['EU DMA enforcement imposes structural remedies on ad targeting','Teen engagement drops >10% YoY'],
  },
  {
    id:'BRK.B:1714002000', ticker:'BRK.B', finalVerdict:'HOLD', riskRating:'LOW',
    convictionScore:68, suggestedAllocationPct:2.1, timeHorizon:'24+ months', expectedUpside:14,
    keyCatalysts:['$168B cash pile provides extraordinary optionality','Insurance float generating superior returns in high-rate environment'],
    cioSummary:'Berkshire trades at a modest premium to book. Attractive as a defensive position given macro uncertainty.',
    agentScores:[
      { persona:'buffett', verdict:'BUY',  confidence:95, rationale:'This is our own portfolio — full conviction.' },
      { persona:'munger',  verdict:'BUY',  confidence:90, rationale:'Obvious.' },
      { persona:'ackman',  verdict:'HOLD', confidence:60, rationale:'Capital allocation will slow without Buffett\'s personal network.' },
      { persona:'cohen',   verdict:'HOLD', confidence:55, rationale:'Low beta, limited near-term catalyst.' },
      { persona:'dalio',   verdict:'BUY',  confidence:72, rationale:'Best defensive compounding vehicle available.' },
    ],
    killConditions:['Succession uncertainty creates premium compression','Insurance catastrophe losses spike materially'],
  },
  {
    id:'MSTR:1714003000', ticker:'MSTR', finalVerdict:'MONITOR', riskRating:'HIGH',
    convictionScore:71, suggestedAllocationPct:1.5, timeHorizon:'6–24 months', expectedUpside:55,
    keyCatalysts:['Bitcoin treasury strategy creates leveraged BTC exposure at NAV premium','Inclusion in Nasdaq-100 drives systematic fund inflows','Convertible note issuance at low rates funds continued BTC accumulation','Michael Saylor\'s "digital capital" narrative gaining institutional traction'],
    cioSummary:'MSTR is a high-volatility Bitcoin proxy. Agent consensus split — value investors reject it, momentum and macro agents see asymmetric upside. Size accordingly: 1.5% max.',
    agentScores:[
      { persona:'buffett', verdict:'PASS', confidence:14, rationale:'I don\'t understand it and I don\'t need to. Speculation masquerading as strategy.' },
      { persona:'munger',  verdict:'PASS', confidence:11, rationale:'Rat poison squared, now with leverage. Absolutely not.' },
      { persona:'ackman',  verdict:'HOLD', confidence:58, rationale:'Interesting vehicle but premium-to-NAV is unjustifiable long-term.' },
      { persona:'cohen',   verdict:'BUY',  confidence:84, rationale:'Momentum is everything here. BTC uptrend intact, Nasdaq inclusion = forced buying.' },
      { persona:'dalio',   verdict:'BUY',  confidence:72, rationale:'Digital gold thesis strengthening. Small allocation in a diversified book.' },
    ],
    killConditions:['Bitcoin price sustained break below $60,000','Regulatory action targeting corporate BTC treasury strategies','Convertible debt refinancing risk if BTC declines >40%','Saylor liquidation or leadership change'],
  },
]

const FEED_ITEMS = [
  { id:'f0', type:'decision',  ticker:'MSTR',  convictionScore:71, headline:'CIO monitor: Bitcoin proxy — split verdict, high upside', timestamp:Date.now()-55000 },
  { id:'f1', type:'decision',  ticker:'NVDA',  convictionScore:87, headline:'CIO approved: Blackwell cycle catalyst confirmed', timestamp:Date.now()-120000 },
  { id:'f2', type:'decision',  ticker:'META',  convictionScore:82, headline:'CIO approved: FCF yield expansion thesis intact', timestamp:Date.now()-310000 },
  { id:'f3', type:'decision',  ticker:'BRK.B', convictionScore:68, headline:'CIO hold: Cash deployment optionality intact', timestamp:Date.now()-600000 },
  { id:'f4', type:'detection', ticker:'AAPL',  headline:'New opportunity detected — agent analysis running', timestamp:Date.now()-45000 },
  { id:'f5', type:'detection', ticker:'MSFT',  headline:'Azure growth reacceleration flagged by scanner', timestamp:Date.now()-95000 },
  { id:'f6', type:'detection', ticker:'GOOGL', headline:'Search monetization recovery signal detected', timestamp:Date.now()-210000 },
  { id:'f7', type:'detection', ticker:'AMZN',  headline:'AWS segment inflection point identified', timestamp:Date.now()-480000 },
  { id:'f8', type:'rejection', ticker:'TSLA',  headline:'Rejected: Conviction threshold not met', rejectionReason:'Agent consensus divided; Buffett and Munger both passed.', timestamp:Date.now()-900000 },
  { id:'f9', type:'rejection', ticker:'COIN',  headline:'Rejected: Macro risk profile too high', rejectionReason:'High regulatory tail risk. Dalio and Buffett both rejected.', timestamp:Date.now()-1800000 },
  { id:'f10',type:'rejection', ticker:'GME',   headline:'Rejected: No fundamental thesis', rejectionReason:'Unanimous rejection across all agent personas.', timestamp:Date.now()-3600000 },
]

// ══════════════════════════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════════════════════════

function relTime(ts) {
  const s = Math.floor((Date.now()-ts)/1000)
  if (s < 60) return s+'s'
  const m = Math.floor(s/60); if (m < 60) return m+'m'
  return Math.floor(m/60)+'h'
}

function verdictColor(v) {
  switch((v||'').toUpperCase()) {
    case 'BUY': case 'INVEST': return { bg:'rgba(34,197,94,.12)', text:'#4ade80', border:'#22c55e' }
    case 'SELL':               return { bg:'rgba(239,68,68,.12)',  text:'#f87171', border:'#ef4444' }
    case 'HOLD':               return { bg:'rgba(245,158,11,.12)', text:'#fbbf24', border:'#f59e0b' }
    case 'MONITOR':            return { bg:'rgba(99,102,241,.15)', text:'#818cf8', border:'#6366f1' }
    default:                   return { bg:'rgba(255,255,255,.06)',text:'#6b6b7b', border:'#3a3a4a' }
  }
}

function riskColor(r) {
  switch((r||'').toUpperCase()) {
    case 'LOW':    return { bg:'rgba(34,197,94,.1)',   text:'#4ade80' }
    case 'MEDIUM': return { bg:'rgba(245,158,11,.1)',  text:'#fbbf24' }
    case 'HIGH':   return { bg:'rgba(239,68,68,.1)',   text:'#f87171' }
    default:       return { bg:'rgba(255,255,255,.06)',text:'#6b6b7b' }
  }
}

function confBarColor(c) {
  if (c > 70) return '#22c55e'
  if (c >= 40) return '#f59e0b'
  return '#ef4444'
}

function badge(text, bgColor, textColor) {
  return `<span class="badge" style="background:${bgColor};color:${textColor};">${text}</span>`
}

// ══════════════════════════════════════════════════════════════════════════════
// FEED RENDERING
// ══════════════════════════════════════════════════════════════════════════════

function renderFeedItem(item) {
  const barColor = { detection:'#3b82f6', decision:'#22c55e', rejection:'#ef4444' }[item.type]
  return `
    <button class="fi-btn" onclick="openSheet('${item.id}')">
      <div class="fc">
        <div class="fc-bar" style="background:${barColor};"></div>
        <div class="fc-body">
          <div class="fc-row">
            <span class="fc-ticker">${item.ticker}</span>
            <div class="fc-meta">
              ${item.convictionScore !== undefined ? `<span class="fc-conv">${item.convictionScore}</span>` : ''}
              <span class="fc-time">${relTime(item.timestamp)}</span>
            </div>
          </div>
          <p class="fc-headline">${item.headline}</p>
          ${item.rejectionReason ? `<p class="fc-rejection">${item.rejectionReason}</p>` : ''}
        </div>
      </div>
    </button>`
}

function renderFeed() {
  const conviction = FEED_ITEMS.filter(i=>i.type==='decision'&&i.convictionScore).sort((a,b)=>b.convictionScore-a.convictionScore).slice(0,3)
  const live       = FEED_ITEMS.slice(0,8)
  const rejected   = FEED_ITEMS.filter(i=>i.type==='rejection').slice(0,5)
  document.getElementById('feed-conviction').innerHTML = conviction.map(renderFeedItem).join('')
  document.getElementById('feed-live').innerHTML       = live.map(renderFeedItem).join('')
  document.getElementById('feed-rejected').innerHTML   = rejected.map(renderFeedItem).join('')
}

// ══════════════════════════════════════════════════════════════════════════════
// OPPORTUNITY CARDS
// ══════════════════════════════════════════════════════════════════════════════

function renderAgentRow(score) {
  const a = AGENTS.find(a=>a.key===score.persona)||{name:score.persona, dot:'#6b6b7b'}
  const w = Math.max(0,Math.min(100,score.confidence))
  const barColor = confBarColor(score.confidence)
  const vColor = ({BUY:'#4ade80',INVEST:'#4ade80',SELL:'#f87171',PASS:'#f87171',HOLD:'#fbbf24'})[score.verdict.toUpperCase()]||'#6b6b7b'
  return `
    <div class="agent-row" title="${score.rationale||''}">
      <span class="agent-dot" style="background:${a.dot};"></span>
      <span class="agent-name">${a.name}</span>
      <div class="agent-bar-bg"><div class="agent-bar-fill" style="width:${w}%;background:${barColor};"></div></div>
      <span class="agent-score">${score.confidence}</span>
      <span class="agent-verdict" style="color:${vColor};">${score.verdict}</span>
    </div>`
}

function renderOpportunityCard(opp) {
  const vc = verdictColor(opp.finalVerdict)
  const rc = riskColor(opp.riskRating)
  const conv = opp.convictionScore > 1 ? Math.round(opp.convictionScore) : Math.round(opp.convictionScore*100)
  const alloc = opp.suggestedAllocationPct > 1 ? opp.suggestedAllocationPct.toFixed(1) : (opp.suggestedAllocationPct*100).toFixed(1)
  const convColor = conv >= 75 ? '#4ade80' : conv >= 55 ? '#fbbf24' : '#f87171'
  return `
    <div class="opp-card">
      <div class="opp-accent" style="background:linear-gradient(90deg,${vc.border},transparent 70%);"></div>
      <div class="opp-inner">
        <div class="opp-head">
          <span class="opp-ticker">${opp.ticker}</span>
          ${badge(opp.finalVerdict, vc.bg, vc.text)}
          ${badge(opp.riskRating,   rc.bg, rc.text)}
        </div>
        <div class="opp-conv-row">
          <span class="opp-conv-num" style="color:${convColor};">${conv}</span>
          <span class="opp-conv-lbl">conviction</span>
        </div>
        <div class="metrics">
          <div class="metric"><div class="metric-k">Allocation</div><div class="metric-v">${alloc}%</div></div>
          <div class="metric"><div class="metric-k">Horizon</div><div class="metric-v" style="font-size:11px;">${opp.timeHorizon||'—'}</div></div>
          <div class="metric"><div class="metric-k">Upside</div><div class="metric-v">${opp.expectedUpside!=null?opp.expectedUpside+'%':'—'}</div></div>
        </div>
        ${opp.keyCatalysts&&opp.keyCatalysts.length ? `
          <div class="cat-list">
            ${opp.keyCatalysts.map(c=>`<div class="cat-item"><span class="cat-dot">▸</span><span>${c}</span></div>`).join('')}
          </div>` : ''}
        <div>
          <div class="agent-section-lbl">Agent Analysis</div>
          <div class="agent-rows">${opp.agentScores.map(renderAgentRow).join('')}</div>
        </div>
        ${opp.cioSummary ? `
          <div class="cio-box">
            <span class="cio-lbl">CIO</span>
            <span class="cio-text">${opp.cioSummary}</span>
          </div>` : ''}
      </div>
    </div>`
}

function renderOpportunities() {
  document.getElementById('opp-count').textContent = OPPORTUNITIES.length + ' active'
  document.getElementById('opp-list').innerHTML = OPPORTUNITIES.map(renderOpportunityCard).join('')
}

// ══════════════════════════════════════════════════════════════════════════════
// SHEET
// ══════════════════════════════════════════════════════════════════════════════

function openSheet(feedId) {
  const fi = FEED_ITEMS.find(f=>f.id===feedId); if (!fi) return
  const ticker = fi.ticker
  const opp = OPPORTUNITIES.find(o=>o.ticker===ticker)
  document.getElementById('sheet-ticker').textContent = ticker
  const vc = verdictColor(opp ? opp.finalVerdict : '')
  document.getElementById('sheet-verdict-badge').innerHTML = opp ? badge(opp.finalVerdict, vc.bg, vc.text) : ''
  let body = ''
  if (opp) {
    const conv  = opp.convictionScore > 1 ? Math.round(opp.convictionScore) : Math.round(opp.convictionScore*100)
    const alloc = opp.suggestedAllocationPct > 1 ? opp.suggestedAllocationPct.toFixed(1) : (opp.suggestedAllocationPct*100).toFixed(1)
    const rc = riskColor(opp.riskRating)
    body = `
      <section>

// PIPELINE GRAPH (SVG)
// ══════════════════════════════════════════════════════════════════════════════

function renderGraph() {
  const svg = document.getElementById('pipeline-svg')
  const W = svg.clientWidth || 600
  const H = svg.clientHeight || 500
  const cx = W/2
  const nodeW=144, nodeH=44, agentW=130, agentH=40
  const inputY=60, agentY=165, gateY=295, outY=395
  const agentXs = [-240,-120,0,120,240].map(dx=>cx+dx)

  const nodes = [
    { id:'input',    x:cx,         y:inputY, type:'stage', label:'MARKET DATA', sub:'Signal Scanner',  status:'complete' },
    { id:'buf',      x:agentXs[0], y:agentY, type:'agent', label:'BUFFETT',     sub:'Value Filter',    status:'running', dot:'#fbbf24' },
    { id:'mun',      x:agentXs[1], y:agentY, type:'agent', label:'MUNGER',      sub:'Quality Check',   status:'running', dot:'#a78bfa' },
    { id:'ack',      x:agentXs[2], y:agentY, type:'agent', label:'ACKMAN',      sub:'Catalyst Hunt',   status:'running', dot:'#22d3ee' },
    { id:'coh',      x:agentXs[3], y:agentY, type:'agent', label:'COHEN',       sub:'Momentum Scan',   status:'running', dot:'#f472b6' },
    { id:'dal',      x:agentXs[4], y:agentY, type:'agent', label:'DALIO',       sub:'Macro Lens',      status:'running', dot:'#38bdf8' },
    { id:'gate',     x:cx,         y:gateY,  type:'gate',  label:'CIO GATE',    sub:'Conviction ≥ 65', status:'running' },
    { id:'decision', x:cx,         y:outY,   type:'stage', label:'DECISION',    sub:'Portfolio Engine',status:'running' },
  ]

  const edges = [
    {from:'input',to:'buf',a:true},{from:'input',to:'mun',a:true},{from:'input',to:'ack',a:true},
    {from:'input',to:'coh',a:true},{from:'input',to:'dal',a:true},
    {from:'buf',to:'gate',a:true},{from:'mun',to:'gate',a:true},{from:'ack',to:'gate',a:true},
    {from:'coh',to:'gate',a:true},{from:'dal',to:'gate',a:true},
    {from:'gate',to:'decision',a:true},
  ]

  const byId = id => nodes.find(n=>n.id===id)
  const sc   = s => ({idle:'#3a3a4a', running:'#f59e0b', complete:'#22c55e', error:'#ef4444'})[s]||'#3a3a4a'

  let eSVG = ''
  edges.forEach((e,i) => {
    const f = byId(e.from), t = byId(e.to); if(!f||!t) return
    const y1 = f.y + (f.type==='agent'?agentH/2:nodeH/2)
    const y2 = t.y - (t.type==='agent'?agentH/2:nodeH/2)
    const my = (y1+y2)/2
    const d = `M${f.x},${y1} C${f.x},${my} ${t.x},${my} ${t.x},${y2}`
    const col = e.a ? '#6366f1' : 'rgba(255,255,255,0.05)'
    eSVG += `<path id="ep${i}" d="${d}" fill="none" stroke="${col}" stroke-width="${e.a?1.5:1}" ${e.a?'stroke-dasharray="6 6"':''} opacity="${e.a?0.7:0.3}">`
    if (e.a) eSVG += `<animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/>`
    eSVG += `</path>`
    if (e.a) {
      eSVG += `<circle r="2.5" fill="#818cf8" opacity=".85">
        <animateMotion dur="${1.6+i*0.13}s" repeatCount="indefinite"><mpath href="#ep${i}"/></animateMotion>
      </circle>`
    }
  })

  let nSVG = ''
  nodes.forEach(n => {
    const w = n.type==='agent' ? agentW : nodeW
    const h = n.type==='agent' ? agentH : nodeH
    const rx= n.type==='gate'  ? 12 : 7
    const bg= n.type==='gate'  ? '#080810' : '#0e0e14'
    const stroke= n.type==='stage'||n.type==='gate' ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.07)'
    const statusDot = sc(n.status)
    const isRunning = n.status==='running'

    // Subtle glow on running nodes
    const glowFilter = isRunning ? `filter:drop-shadow(0 0 6px rgba(245,158,11,0.25));` : ''

    nSVG += `<g transform="translate(${n.x-w/2},${n.y-h/2})" style="${glowFilter}">`
    // Background
    nSVG += `<rect width="${w}" height="${h}" rx="${rx}" fill="${bg}" stroke="${stroke}" stroke-width="1"/>`
    // Top accent line on stage/gate nodes
    if (n.type==='stage'||n.type==='gate') {
      nSVG += `<line x1="0" y1="0" x2="${w}" y2="0" stroke="rgba(99,102,241,0.4)" stroke-width="1.5" stroke-linecap="round"/>`
    }
    // Status dot
    nSVG += `<circle cx="${w-13}" cy="13" r="4" fill="${statusDot}">`
    if (isRunning) nSVG += `<animate attributeName="r" values="3;5;3" dur="1.2s" repeatCount="indefinite"/>`
    nSVG += `</circle>`
    // Persona dot
    if (n.dot) nSVG += `<circle cx="16" cy="${h/2}" r="5" fill="${n.dot}"/>`
    // Label
    const lx = n.dot ? 28 : w/2
    const ta = n.dot ? 'start' : 'middle'
    nSVG += `<text x="${lx}" y="${h/2-5}" fill="rgba(237,237,240,0.75)" font-size="10" font-weight="600" letter-spacing="1.2" text-anchor="${ta}" font-family="'Fira Code',monospace">${n.label}</text>`
    nSVG += `<text x="${lx}" y="${h/2+10}" fill="rgba(255,255,255,0.25)" font-size="9" text-anchor="${ta}" font-family="'Fira Code',monospace">${n.sub}</text>`
    nSVG += `</g>`
  })

  // Minimap
  const mx=W-118, my=H-88, mw=106, mh=76
  let mmSVG = `<rect x="${mx}" y="${my}" width="${mw}" height="${mh}" rx="5" fill="rgba(5,5,7,0.9)" stroke="rgba(255,255,255,0.07)"/>`
  nodes.forEach(n => {
    const px = mx+4+((n.x-80)/(W-160||1))*(mw-8)
    const py = my+4+((n.y-40)/(H-80||1))*(mh-8)
    mmSVG += `<rect x="${px-5}" y="${py-3}" width="22" height="8" rx="2" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width=".5"/>`
  })

  svg.innerHTML = eSVG + nSVG + mmSVG
}

function verdictFromConfidence(c,persona,sector){
  if(sector==='crypto'){

    if(persona==='cohen'||persona==='dalio')    return c>=65?'BUY':'HOLD'
  }
  if(c>=72)return'BUY';if(c>=55)return'HOLD';if(c>=38)return'MONITOR';return'PASS'

function overallVerdictFromScores(scores,conviction){
  const buys=scores.filter(s=>s.verdict==='BUY').length
  const passes=scores.filter(s=>s.verdict==='PASS').length
  if(conviction>=78&&buys>=3)return'BUY'
  if(conviction>=65&&buys>=2)return'MONITOR'
  if(passes>=3||conviction<40)return'PASS'
  return'HOLD'
}
function computeRisk(info){const b=info.beta||1;if(b>2.5||info.sector==='crypto')return'HIGH';if(b>1.4)return'MEDIUM';return'LOW'}
function computeAllocation(conviction,risk){const m={LOW:1.2,MEDIUM:1.0,HIGH:0.5}[risk]||1;return Math.max(0.5,Math.min(6,parseFloat((conviction/100*6*m).toFixed(1))))}

function generateCatalysts(ticker,info,seed){
  const CATS={
    ai:      ['Next-generation model cycle driving enterprise software upgrades','Data center capex tailwind from hyperscaler buildout','Market share gains as competitors fall behind on silicon roadmap','Expanding software attach rate on hardware installed base'],
    tech:    ['Earnings revision cycle turning positive after trough','New product launch expected to re-accelerate top-line growth','Cost restructuring improving operating leverage','Buyback program reducing share count at attractive valuations'],
    crypto:  ['Bitcoin halving cycle historically precedes 12–18 month bull run','Institutional adoption increasing via ETF inflows','Regulatory clarity in key jurisdictions reducing overhang','Balance sheet BTC holdings appreciating as digital scarcity narrative strengthens'],
    consumer:['Pricing power intact despite volume softness — brand premium holding','International expansion into underpenetrated markets','Private label rollback benefiting branded SKUs in key channels','Digital/loyalty channel driving higher-margin recurring revenue'],
    finance: ['Net interest margin expansion in higher-for-longer rate environment','Credit quality resilient with limited loan book deterioration','Fee income diversification reducing rate sensitivity','Buyback yield exceeds 4% — management returning capital aggressively'],
    health:  ['Pipeline readout expected to expand total addressable market significantly','Weight-loss drug cycle driving new patient funnel into chronic care','Biosimilar patent cliff largely priced in — upside from new launches','Aging population driving structural volume growth for decades'],
    energy:  ['Supply discipline from OPEC+ supporting price floor','Permian Basin efficiency gains lowering breakeven cost','LNG export capacity expansion capturing European demand','Free cash flow yield exceeds 8% at spot prices'],
  }
  const pool=CATS[info.sector]||CATS.tech
  const n=hRange(seed,2,3),picked=[]
  for(let i=0;i<n;i++)picked.push(pool[hRange(hsh(ticker+'cat'+i),0,pool.length-1)])
  return[...new Set(picked)].slice(0,n)
}

function generateKillConditions(ticker,info,seed){
  const KILLS={
    ai:      ['Hyperscaler capex guidance cuts exceed 20%','Export control expansion into new geographies','Competitor architecture breakthrough closes performance gap','Gross margin compression signals pricing power erosion'],
    tech:    ['Revenue growth decelerates below 5% for two consecutive quarters','Key customer concentration risk materializes','Regulatory antitrust action disrupts core business model','Macro slowdown compresses enterprise IT budgets'],
    crypto:  ['Bitcoin price sustained break below $55,000','SEC enforcement action against company or industry','Convertible note refinancing risk in down market','Founder/key management departure or strategic pivot'],
    consumer:['Volume decline accelerates as consumer trade-down intensifies','Commodity cost spike cannot be passed through to consumers','New entrant with structural cost advantage gains share','Brand perception deterioration in key demographic'],
    finance: ['Credit cycle deterioration causes material loan loss provisions','Rate cuts compress net interest margin below cost of capital','Regulatory capital requirements increase significantly','Fintech disruption accelerates share loss in core segments'],
    health:  ['Clinical trial failure in key pipeline asset','Pricing reform legislation passes materially reducing reimbursement','Patent cliff earlier or deeper than anticipated','Safety signal emerges post-approval for blockbuster drug'],
    energy:  ['OPEC+ production discipline breaks down triggering price war','Demand destruction from accelerating EV adoption','Carbon tax legislation materially increases extraction costs','Geopolitical disruption in core operating regions'],
  }
  const pool=KILLS[info.sector]||KILLS.tech,picked=[]
  for(let i=0;i<2;i++)picked.push(pool[hRange(hsh(ticker+'kill'+i),0,pool.length-1)])
  return[...new Set(picked)]
}

function generateCIOSummary(ticker,info,conviction,verdict,agentScores){
  const riskAdj={HIGH:'high-risk, high-reward',MEDIUM:'balanced risk/reward',LOW:'defensive'}[computeRisk(info)]||''
  const buys=agentScores.filter(s=>s.verdict==='BUY').length
  const dissenters=agentScores.filter(s=>s.verdict==='PASS'||s.verdict==='SELL').map(s=>{const a=AGENTS.find(a=>a.key===s.persona);return a?a.name.split(' ').pop():s.persona})
  const majority=buys>=3?`${buys}/5 agents recommend BUY`:`Agents split — ${buys}/5 bullish`
  const dissent=dissenters.length?` ${dissenters.join(' and ')} dissent${dissenters.length>1?'':'s'}.`:''
  const S={
    BUY:     `Strong conviction long. ${majority}.${dissent} Sized at ${computeAllocation(conviction,computeRisk(info))}% — ${riskAdj} position.`,
    HOLD:    `Monitor closely. ${majority}.${dissent} No position change — wait for a cleaner entry or catalyst confirmation.`,
    MONITOR: `Watchlist addition. ${majority}.${dissent} Asymmetric setup warrants a small starter position (${computeAllocation(conviction,computeRisk(info))}%) with room to add.`,
    PASS:    `No position. ${majority}.${dissent} Risk/reward does not meet threshold at current levels.`,
  }
  return S[verdict]||S.HOLD
}

const AV_KEY = '9Q6XFBSJMDTX59PR'

function mapAVSector(sector, industry) {
  const s = (sector   || '').toLowerCase()
  const d = (industry || '').toLowerCase()
  if (d.includes('semiconductor') || d.includes('software') || d.includes('computer hardware') || d.includes('artificial intelligence') || d.includes('data processing')) return 'ai'
  if (d.includes('bitcoin') || d.includes('crypto') || d.includes('blockchain')) return 'crypto'
  if (s.includes('health') || d.includes('drug') || d.includes('biotech') || d.includes('medical') || d.includes('pharmaceutical')) return 'health'
  if (s.includes('energy') || d.includes('oil') || d.includes('gas')) return 'energy'
  if (s.includes('financ') || d.includes('bank') || d.includes('insurance') || d.includes('investment') || d.includes('credit')) return 'finance'
  if (s.includes('consumer') || d.includes('restaurant') || d.includes('retail') || d.includes('apparel') || d.includes('food') || d.includes('beverage')) return 'consumer'
  return 'tech'
}

function fNum(v) { const n = parseFloat(v); return isNaN(n) ? null : n }
function fmtMktCap(v) {
  const n = typeof v==='string' ? parseInt(v) : v
  if (!n || isNaN(n)) return null
  if (n>=1e12) return `$${(n/1e12).toFixed(2)}T`
  if (n>=1e9)  return `$${(n/1e9).toFixed(1)}B`
  if (n>=1e6)  return `$${(n/1e6).toFixed(0)}M`
  return `$${n}`
}

async function fetchRealData(ticker) {
  const out = { name:ticker, sector:'tech', beta:1.0, pe:null, eps:null, margin:0, growth:0, isLive:false, sources:['Alpha Vantage'] }

  // Fetch live price + fundamentals in parallel (2 AV calls)
  const [qRes, ovRes] = await Promise.allSettled([
    fetch(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${ticker}&apikey=${AV_KEY}`).then(r=>r.json()),
    fetch(`https://www.alphavantage.co/query?function=OVERVIEW&symbol=${ticker}&apikey=${AV_KEY}`).then(r=>r.json()),
  ])

  // GLOBAL_QUOTE → live prijs + dagwijziging
  if (qRes.status === 'fulfilled') {
    const gq = qRes.value?.['Global Quote'] || {}
    if (gq['05. price']) {
      out.price     = parseFloat(gq['05. price'])
      out.prevClose = parseFloat(gq['08. previous close']) || null
      out.volume    = parseInt(gq['06. volume'])           || null
      const chg     = parseFloat((gq['10. change percent'] || '').replace('%',''))
      out.changeP   = !isNaN(chg) ? (chg >= 0 ? `+${chg.toFixed(2)}%` : `${chg.toFixed(2)}%`) : null
      out.isLive    = true
    }
  }

  // OVERVIEW → fundamentals
  if (ovRes.status === 'fulfilled') {
    const d = ovRes.value || {}
    if (d.Symbol) {
      out.name          = d.Name          || out.name
      out.sector        = mapAVSector(d.Sector, d.Industry)
      out.industry      = d.Industry      || null
      out.beta          = fNum(d.Beta)    || out.beta
      out.pe            = fNum(d.PERatio)
      out.eps           = fNum(d.EPS)
      out.margin        = fNum(d.ProfitMargin)              || out.margin
      out.growth        = fNum(d.QuarterlyRevenueGrowthYOY) || out.growth
      out.week52High    = fNum(d['52WeekHigh'])
      out.week52Low     = fNum(d['52WeekLow'])
      out.mktCap        = parseInt(d.MarketCapitalization)  || null
      out.analystTarget = fNum(d.AnalystTargetPrice)        || null
      out.upside        = out.price && out.analystTarget
        ? Math.round((out.analystTarget - out.price) / out.price * 100) : null
      out.isLive = true
    }
  }

  return out.isLive ? out : null
}

function generateTickerAnalysis(ticker, realInfo){
  ticker=ticker.toUpperCase().trim()
  const info=realInfo||TICKER_DB[ticker]||{name:ticker,sector:'tech',beta:1.3,pe:25,margin:.12,growth:.10}
  const bias=SECTOR_BIAS[info.sector]||[0,0,0,0,0]
  const h=hsh(ticker)
  const agentScores=AGENTS.map((a,i)=>{
    const base=hRange(hsh(ticker+a.key+'score'),42,76)
    const confidence=Math.max(5,Math.min(97,base+bias[i]))
    const verdict=verdictFromConfidence(confidence,a.key,info.sector)
    return{persona:a.key,verdict,confidence,rationale:mkRationale(a.key,ticker,info,confidence,verdict)}
  })
  const avgConv=Math.round(agentScores.reduce((s,a)=>s+a.confidence,0)/5)
  const finalVerdict=overallVerdictFromScores(agentScores,avgConv)
  const riskRating=computeRisk(info)
  return{
    id:`${ticker}:${Date.now()}`,ticker,finalVerdict,riskRating,convictionScore:avgConv,
    suggestedAllocationPct:computeAllocation(avgConv,riskRating),
    timeHorizon:HORIZONS[hRange(hsh(ticker+'hz'),0,HORIZONS.length-1)],
    expectedUpside:realInfo&&realInfo.upside!=null?realInfo.upside:hRange(hsh(ticker+'up'),8,62),
    keyCatalysts:generateCatalysts(ticker,info,h),
    agentScores,
    cioSummary:generateCIOSummary(ticker,info,avgConv,finalVerdict,agentScores),
    killConditions:generateKillConditions(ticker,info,h),
  }
}

  document.getElementById('az-status-label').textContent=`FETCHING LIVE MARKET DATA…`
  document.getElementById('az-progress-bar').style.width='5%'

  let realInfo = null
  try {
    realInfo = await fetchRealData(ticker)
    console.log('[HF] startAnalysis realInfo:', realInfo)
  } catch(e) {
    console.warn('[HF] fetchRealData threw:', e)
  }

  document.getElementById('az-status-label').textContent=`SCANNING ${ticker}…`
  document.getElementById('az-progress-bar').style.width='10%'

  const rows=document.getElementById('az-agent-rows')
  rows.innerHTML=''

  for(let i=0;i<AGENTS.length;i++){
    const a=AGENTS[i]
    await new Promise(r=>setTimeout(r,360))

      <span style="font-family:'Fira Code',monospace;font-size:11px;color:rgba(237,237,240,0.65);flex:1;">${a.name}</span>
      <span style="font-family:'Fira Code',monospace;font-size:9px;color:rgba(72,72,90,0.9);letter-spacing:.1em;">ANALYSING</span>
      <span style="display:flex;gap:2px;align-items:center;" id="adots_${i}">
        ${[0,1,2].map(j=>`<span style="width:3px;height:3px;border-radius:50%;background:rgba(72,72,90,0.9);display:inline-block;animation:pulse ${.5+j*.2}s infinite;"></span>`).join('')}
      </span>`
    rows.appendChild(div)
    requestAnimationFrame(()=>{div.style.opacity='1'})
    document.getElementById('az-progress-bar').style.width=`${12+(i+1)*13}%`
  }

  await new Promise(r=>setTimeout(r,400))
  document.getElementById('az-status-label').textContent='CIO GATE — FINALIZING…'
  document.getElementById('az-progress-bar').style.width='88%'

  rows.querySelectorAll('div').forEach((div,i)=>{
    setTimeout(()=>{
      const dotsEl=div.querySelector(`#adots_${i}`)
      if(dotsEl)dotsEl.innerHTML=`<span style="font-family:'Fira Code',monospace;font-size:11px;color:#22c55e;font-weight:700;">✓</span>`
    },i*80)
  })

  await new Promise(r=>setTimeout(r,700))
  try{
    const analysis=generateTickerAnalysis(ticker, realInfo)
    const existing=OPPORTUNITIES.findIndex(o=>o.ticker===ticker)
    if(existing!==-1)OPPORTUNITIES.splice(existing,1)
    OPPORTUNITIES.unshift(analysis)
    const feedType=analysis.finalVerdict==='PASS'?'rejection':analysis.finalVerdict==='BUY'?'decision':'detection'
    FEED_ITEMS.unshift({
      id:'az_'+Date.now(),type:feedType,ticker,
      convictionScore:feedType==='decision'?analysis.convictionScore:undefined,
      headline:`CIO ${analysis.finalVerdict}: ${analysis.cioSummary.split('.')[0]}`,
      rejectionReason:feedType==='rejection'?analysis.cioSummary:undefined,
      timestamp:Date.now(),
    })
    document.getElementById('az-progress-bar').style.width='100%'
    document.getElementById('az-status-label').textContent=`${ticker} — DECISION COMPLETE`
    renderFeed(); renderOpportunities()
    await new Promise(r=>setTimeout(r,500))
    showAnalyzeResult(analysis, realInfo)
  }catch(err){
    document.getElementById('az-loading').style.display='none'
    document.getElementById('az-error').style.display='block'
    document.getElementById('az-error-msg').textContent=`Analysis failed for "${ticker}". Check the ticker symbol and try again.`
  }
}
